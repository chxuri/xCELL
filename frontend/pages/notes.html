<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xCELL | notes</title>
    <link rel="stylesheet" href="../styles/index.css">
    <script src="/frontend/scripts/main.js" defer></script>
    <script src="/frontend/scripts/notes.js" defer></script>
</head>
<body>
    <header> 
        <div class="navlinks">
            <div class="leftlinks">
                <a href="/frontend/pages/index.html"><img class="logo" src="/frontend/resources/images/xCELL-logo.png"></a>
                <a href="/frontend/pages/model.html">MODEL</a>
                <a href="/frontend/pages/notes.html">NOTES</a>
            </div>
            <div class="rightlinks">
                <a id="topRight" href="http://localhost:8080/oauth2/authorization/google">LOG IN</a>
                <img id="profilePic"></img>
            </div>
        </div>
    </header>

    <div class="hero solid-hero">

        <div id="notesContainer">
            
            <div id="exampleNote">
                <div class="note" data-id>
                        <div class="note-top">
                            <div class="note-date note-top-left">
                                date
                            </div>
                            <div class="note-top-right">
                                <a class="edit-note small-button">edit</a>
                                <a class="delete-note small-button">delete</a>
                            </div>
                        </div>


                        <div class="note-title">
                            title
                        </div>

                        <div class="note-content">
                            content
                        </div>


                </div>
            </div>
        </div>

    </div>


</body>
</html>
