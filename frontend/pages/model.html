<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xCELL | model</title>
    <link rel="stylesheet" href="../styles/index.css">
    <script src="../scripts/main.js" defer></script>
    <script src="../scripts/model.js" defer></script>
</head>
<body>
    <header> 
        <div class="navlinks">
            <div class="leftlinks">
                <a href="../pages/index.html"><img class="logo" src="/resources/images/xCELL-logo.png"></a>
                <a href="../pages/model.html">MODEL</a>
                <a href="../pages/notes.html">NOTES</a>
            </div>
            <div class="rightlinks">
                <a id="topRight" href="http://localhost:8080/oauth2/authorization/google">LOG IN</a>
                <img id="profilePic"></img>
            </div>
        </div>
    </header>

    <div class="hero solid-hero">

        <div class="model-left">
            <div id="animalCellContainer">
                <img id="animalCell" src="/resources/images/Animal-cell/Animal_Cell_cropped.svg">
                <svg id="animalOrganelleOverlay" viewBox="0 0 485 490">
                    <image
                        id="cellMembraneA"
                        class="organelle"
                        href="/resources/images/Animal-cell/Animal_Cell-cell-membrane.png"
                        x="4"
                        y="-5"
                        width="99%"
                        height="94%"
                    />
                    <image
                        id="cytoskeletonA"
                        class="organelle"
                        href="/resources/images/Animal-cell/Animal_Cell-cytoskeleton.png"
                        x="100"
                        y="10"
                        width="30%"
                        height="20%"
                    />
                    <image
                        id="cytoskeleton2"
                        class="organelle"
                        href="/resources/images/Animal-cell/Animal_Cell-cytoskeleton-copy.png"
                        x="279"
                        y="78"
                        width="30%"
                        height="20%"
                    />
                    <image
                        id="smoothERA"
                        class="organelle"
                        href="/resources/images/Animal-cell/Animal_Cell-smooth-ER.png"
                        x="112"
                        y="70"
                        width="42%"
                        height="42%"
                    />
                    <image
                        id="roughERA"
                        class="organelle"
                        href="/resources/images/Animal-cell/Animal_Cell-rough-ER.png"
                        x="210"
                        y="124"
                        width="42%"
                        height="42%"
                    />
                    <image
                        id="nucleusA"
                        class="organelle"
                        href="/resources/images/Animal-cell/Animal_Cell-nuclear-envelope_nucleus.png"
                        x="156"
                        y="75"
                        width="38%"
                        height="38%"
                    />
                    <image
                        id="golgiA"
                        class="organelle"
                        href="/resources/images/Animal-cell/Animal_Cell-golgi-apparatus.png"
                        x="109"
                        y="156"
                        width="39%"
                        height="50%"
                    />
                    <image
                        id="vesicle1"
                        class="organelle"
                        href="/resources/images/Animal-cell/Animal_Cell-lysosomes_vesicle-copy.png"
                        x="213"
                        y="-55"
                        width="8%"
                        height="50%"
                    />
                    <image
                        id="vesicle2"
                        class="organelle"
                        href="/resources/images/Animal-cell/Animal_Cell-lysosomes_vesicle.png"
                        x="120"
                        y="-2"
                        width="7%"
                        height="50%"
                    />
                    <image
                        id="nucleolusA"
                        class="organelle"
                        href="/resources/images/Animal-cell/Animal_Cell-nucleolus.png"
                        x="227"
                        y="143"
                        width="12%"
                        height="12%"
                    />
                    <image
                        id="mitochondria1"
                        class="organelle"
                        href="/resources/images/Animal-cell/Animal_Cell-mitochondria-copy.png"
                        x="285"
                        y="280"
                        width="19%"
                        height="23%"
                    />
                    <image
                        id="mitochondria2"
                        class="organelle"
                        href="/resources/images/Animal-cell/Animal_Cell-mitochondria.png"
                        x="196"
                        y="308"
                        width="19%"
                        height="23%"
                    />
                    <image
                        id="ribosomes"
                        class="organelle"
                        href="/resources/images/Animal-cell/Animal_Cell-free-ribosomes.png"
                        x="80"
                        y="130"
                        width="10%"
                        height="23%"
                    />
                </svg>
            </div>
        </div>

        <div class="model-right">

            <div id="organelleInfo">
                <div id="organelleTitle">
                    <h2 id="organelleTitleWords">Organelle Information Area</h2>
                </div>
                <div id="organelleContent">
                    <p id="organelleContentWords">click an organelle to learn more about it!</p>
                </div>
            </div>

            <div id="notesBox">
                <div id="noteOverlay">
                    please log in to take notes!
                </div>
                <h3 id="noteHeader">NOTES</h3>
                <div id="notePad">
                    
                        <div class="note-field">
                            <label for="noteTitle">Title</label>
                            <input id="noteTitle"></input>
                        </div>

                        <div class="note-field">
                            <label for="noteContent">Content</label>
                            <textarea id="noteContent"></textarea>
                        </div>

                        <div id="noteButtons">
                            <a id="clearNote" class="note-button">Clear</a>
                            <a id="saveNote" class="note-button">Save</a>
                        </div>
                </div>
            </div>
        </div>
    </div>


</body>
</html>
