<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xCELL | model</title>
    <link rel="stylesheet" href="../styles/index.css">
    <script src="/frontend/scripts/main.js" defer></script>
    <script src="/frontend/scripts/model.js" defer></script>
</head>
<body>
    <header> 
        <div class="navlinks">
            <div class="leftlinks">
                <a href="/frontend/pages/about.html">ABOUT</a>
                <a href="/frontend/pages/model.html">MODEL</a>
                <a href="/frontend/pages/tutorial.html">TUTORIAL</a>
                <a href="/frontend/pages/notes.html">NOTES</a>
            </div>
            <div class="rightlinks">
                <a id="topRight" href="http://localhost:8080/oauth2/authorization/google">LOG IN</a>
                <img id="profilePic"></img>
            </div>
        </div>
    </header>

    <div class="hero solid-hero">

        <div class="model-left">
            <div id="animalCellContainer">
                <img id="animalCell" src="/frontend/resources/images/cellSVG/animal-svg/Animal_Cell_cropped.svg">
                <svg id="animalOrganelleOverlay" viewBox="0 0 485 490">
                    <image
                        id="nucleusA"
                        class="organelle"
                        href="/frontend/resources/images/cellSVG/animal-svg/nucleusA.svg"
                        x="-700"
                        y="-327"
                        width="420%"
                        height="250%"
                    />
                    <image
                        id="cellMembraneA"
                        class="organelle"
                        href="/frontend/resources/images/cellSVG/animal-svg/cell-membraneA.svg"
                        x="-700"
                        y="-327"
                        width="420%"
                        height="250%"
                    />
                </svg>
            </div>
        </div>

        <div class="model-right">

            <div id="organelleInfo">
                <div id="organelleTitle">
                    <h2 id="organelleTitleWords">Organelle Information Area</h2>
                </div>
                <div id="organelleContent">
                    <p id="organelleContentWords">click an organelle to learn more about it!</p>
                </div>
            </div>

            <div id="notesBox">
                <div id="noteOverlay">
                    please log in to take notes!
                </div>
                <h3 id="noteHeader">NOTES</h3>
                <div id="notePad">
                    
                        <div class="note-field">
                            <label for="noteTitle">Title</label>
                            <input id="noteTitle"></input>
                        </div>

                        <div class="note-field">
                            <label for="noteContent">Content</label>
                            <textarea id="noteContent"></textarea>
                        </div>

                        <div id="noteButtons">
                            <a id="clearNote" class="note-button">Clear</a>
                            <a id="saveNote" class="note-button">Save</a>
                        </div>
                </div>
            </div>
        </div>
    </div>


</body>
</html>
